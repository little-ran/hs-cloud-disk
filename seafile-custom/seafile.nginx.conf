server {
    listen 80;
    server_name 10.0.124.98;
    client_max_body_size 10m;

    proxy_intercept_errors on;
    error_page 520 = @seahub_error;
    location @seahub_error {
        default_type "text/html; charset=utf-8";
        return 403 "Forbidden.";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = / {
        return 302 $scheme://$http_host/libraries/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000/;
        proxy_read_timeout 310s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        client_max_body_size 0;
        access_log      /shared/seafile/logs/seahub.access.log seafileformat;
        error_log       /shared/seafile/logs/seahub.error.log;
    }

    location /api/v2.1/admin/ {
        satisfy any;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;
        auth_basic "Admin Area - Restricted";
        auth_basic_user_file /shared/seafile/.admin_passwd;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
    }

    # 下载：/seafhttp/files/ —— 开启 buffering + cache（解决一次性 token）
    location /seafhttp/files/ {
        rewrite ^/seafhttp(.*)$ $1 break;
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 0;
        proxy_read_timeout 36000s;
        proxy_buffering on;
        proxy_cache dl_cache;
        proxy_cache_key $request_uri;
        proxy_cache_valid 200 60s;
        proxy_cache_methods GET;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Disposition "attachment" always;
        access_log /shared/seafile/logs/seafhttp.access.log seafileformat;
        error_log /shared/seafile/logs/seafhttp.error.log;
    }

    # 上传及其他：/seafhttp/upload-* —— 关闭 buffering（流式上传）
    location /seafhttp {
        rewrite ^/seafhttp(.*)$ $1 break;
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 0;
        proxy_read_timeout 36000s;
        proxy_buffering off;
        proxy_request_buffering off;
        add_header X-Content-Type-Options "nosniff" always;
        access_log /shared/seafile/logs/seafhttp.access.log seafileformat;
        error_log /shared/seafile/logs/seafhttp.error.log;
    }

    location /seafdav {
        rewrite ^/seafdav$ /seafdav/ permanent;
    }
    location /seafdav/ {
        proxy_pass http://127.0.0.1:8080/seafdav/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_read_timeout 1200s;
        client_max_body_size 0;
        access_log /shared/seafile/logs/seafdav.access.log seafileformat;
        error_log /shared/seafile/logs/seafdav.error.log;
    }
    location /:dir_browser {
        proxy_pass http://127.0.0.1:8080/:dir_browser;
    }
    location /media/ {
        alias /opt/seafile/seafile-server-13.0.25/seahub/media/;
    }
    location = /media {
        return 301 /media/;
    }
}
