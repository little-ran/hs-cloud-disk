# =============================================================================
# Seafile Cloud 13.0 (社区版 / CE) —— Docker Compose 本地部署配置
# 适用环境：Windows 10 + Docker Desktop (WSL2 后端) + Docker Compose v2
#
# 重要说明：
#   1. 本方案使用的是官方预构建镜像 seafileltd/seafile-mc:13.0-latest，
#      不需要从你下载的源码 (D:\cloud\seafile-master) 编译。官方镜像已经
#      包含了编译好的所有组件，是最稳定、最省事的方式。
#   2. 数据库(MySQL/MariaDB)的连接信息从同级 .env 文件注入，容器首次
#      启动会自动建库并初始化，网页端无需填写数据库信息。
#   3. 所有密码/路径/域名均通过 .env 注入，请勿在此写死。
#      修改 .env 后执行：docker compose down && docker compose up -d
#   4. 数据会保存在本 compose 文件同级的 ./seafile-data、./seafile-mysql、
#      ./seafile-redis 三个目录中。
# =============================================================================

name: seafile-docker

services:
  # ---------- 1. 数据库 (MariaDB) ----------
  db:
    image: mariadb:10.11
    container_name: seafile-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}      # 数据库 root 密码（来自 .env）
      - MYSQL_LOG_CONSOLE=true
      - MARIADB_AUTO_UPGRADE=1
    volumes:
      - ./seafile-mysql:/var/lib/mysql            # 数据库持久化目录
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh", "--connect", "--mariadbupgrade", "--innodb_initialized"]
      interval: 20s
      start_period: 30s
      timeout: 5s
      retries: 10

  # ---------- 2. 缓存 (Redis) ----------
  redis:
    image: redis:7
    container_name: seafile-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]   # Redis 密码（来自 .env）
    volumes:
      - ./seafile-redis:/data                     # 缓存持久化目录

  # ---------- 3. Seafile 主服务 ----------
  seafile:
    image: seafileltd/seafile-mc:13.0-latest
    container_name: seafile
    restart: unless-stopped
    ports:
      - "${SEAFILE_PUBLISH_PORT}:80"                 # 宿主机端口 -> 容器 80（来自 .env）
    volumes:
      - ./seafile-data:/shared                    # Seafile 数据与日志目录
      # 持久化覆盖网页端模板 react_app.html（自定义 pageOptions 等，重建后不丢失）
      - ${DEPLOY_ROOT}/react_app.html:/opt/seafile/seafile-server-${SEAFILE_SERVER_VERSION}/seahub/seahub/templates/react_app.html:ro
      # 覆盖管理员后台模板：隐藏左侧「系统信息」菜单 + 「升级到专业版」外链（见 sysadmin-hide-pro.js）
      - ${DEPLOY_ROOT}/sysadmin_react_app.html:/opt/seafile/seafile-server-${SEAFILE_SERVER_VERSION}/seahub/seahub/templates/sysadmin/sysadmin_react_app.html:ro
      # 持久化覆盖登录页模板：原始 .icon-refresh / .op-icon 类未定义，
      # 刷新验证码图标不可见。这里插入 inline CSS 使其可见、
      # 鼠标变指针，复用 sf3-font-refresh 字体。
      - ${DEPLOY_ROOT}/seahub/templates/registration/login.html:/opt/seafile/seafile-server-${SEAFILE_SERVER_VERSION}/seahub/seahub/templates/registration/login.html:ro
      # 持久化 nginx 站点配置：原镜像里 location /media root 指向不完整的 seafile-server-latest
      # 会导致所有 /media/* 静态资源 404。改用 alias 指向真实运行版本。
      # 容器重建后这块挂载会自动生效，无需手动再 cp。
      - ${DEPLOY_ROOT}/seafile.nginx.conf:/etc/nginx/sites-enabled/seafile.nginx.conf:ro
      # 持久化 start.py：注入 seaf-fuse 自动挂载逻辑（容器重建后自动启动 FUSE）
      - ${DEPLOY_ROOT}/start.py:/scripts/start.py:ro
      # —— FUSE 共享挂载：容器内 /mnt/seafile 的 seaf-fuse 挂载通过 rshared 传播到宿主机 ——
      # 宿主机和其他容器均可通过此目录访问 Seafile 原始文件
      # - ${DEPLOY_ROOT}/seafile-conf/seahub_settings.py:/opt/seafile/conf/seahub_settings.py:rw

      - type: bind
        source: ${FUSE_MOUNT_DIR}
        target: /mnt/seafile
        bind:
          propagation: rshared
    devices:
      - /dev/fuse                       # FUSE 字符设备，seaf-fuse 挂载必需
    cap_add:
      - SYS_ADMIN                       # 允许 mount() 系统调用（FUSE 挂载必需）
    security_opt:
      - seccomp:unconfined              # 解除 seccomp 限制，允许 FUSE mount 系统调用
      - apparmor:unconfined             # 解除 AppArmor 限制（Ubuntu 默认 Docker profile 阻止 mount）
    environment:
      # —— 数据库连接（自动初始化，网页端不填）——
      - SEAFILE_MYSQL_DB_HOST=db
      - SEAFILE_MYSQL_DB_PORT=3306
      - SEAFILE_MYSQL_DB_USER=${SEAFILE_DB_USER}              # 由初始化脚本自动创建
      - SEAFILE_MYSQL_DB_PASSWORD=${SEAFILE_DB_PASSWORD}      # seafile 库用户密码（来自 .env）
      - INIT_SEAFILE_MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - SEAFILE_MYSQL_DB_CCNET_DB_NAME=${SEAFILE_CCNET_DB_NAME}
      - SEAFILE_MYSQL_DB_SEAFILE_DB_NAME=${SEAFILE_SEAFILE_DB_NAME}
      - SEAFILE_MYSQL_DB_SEAHUB_DB_NAME=${SEAFILE_SEAHUB_DB_NAME}
      # —— 时区 / 管理员账号（首次启动自动创建）——
      - TIME_ZONE=Asia/Shanghai
      - INIT_SEAFILE_ADMIN_EMAIL=${SEAFILE_ADMIN_EMAIL}       # 管理员邮箱/登录名（来自 .env）
      - INIT_SEAFILE_ADMIN_PASSWORD=${SEAFILE_ADMIN_PASSWORD} # 管理员密码（来自 .env）
      # —— 对外访问地址：必须是 IP 或带点的域名（localhost 会被校验拒绝）——
      - SEAFILE_SERVER_HOSTNAME=${SEAFILE_SERVER_HOSTNAME}
      - SEAFILE_SERVER_PROTOCOL=${SEAFILE_SERVER_PROTOCOL}
      # —— 安全密钥（务必为 >=32 位的随机字符串，来自 .env）——
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY}
      # —— 缓存（使用上面的 Redis）——
      - CACHE_PROVIDER=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # —— 关闭可选组件，保持精简（本地网盘无需）——
      - ENABLE_SEADOC=${ENABLE_SEADOC}
      - ENABLE_NOTIFICATION_SERVER=${ENABLE_NOTIFICATION_SERVER}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
